
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-nginx-test
  namespace: argocd-connectivity-test
  labels:
    app: argocd-nginx-test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: argocd-nginx-test
  template:
    metadata:
      labels:
        app: argocd-nginx-test
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
